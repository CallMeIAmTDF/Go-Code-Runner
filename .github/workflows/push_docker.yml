name: Build and Push Runners
on:
  push:
    branches: [ origin ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [python, java, cpp]

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push
        run: |
          docker build -t iamtdf/runner-${{ matrix.lang }}:latest -f docker/${{ matrix.lang }}/Dockerfile .
          docker push iamtdf/runner-${{ matrix.lang }}:latest
